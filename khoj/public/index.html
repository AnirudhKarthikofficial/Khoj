<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khoj – Search made safe for kids</title>
<meta name="description" content="Khoj is a safe, friendly search engine for kids.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Lexend:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="home">
<div id="app"></div>
<main id="res" class="res">
  <p id="blocked" class="msg" hidden>Oops! Khoj can't search for that. Try animals, space or dinosaurs!</p>
  <section id="answer" class="answer" hidden>
    <h2>Khoj says</h2>
    <p id="ans"></p>
    <p id="srcs" class="srcs"></p>
    <button id="say" class="say" type="button" hidden>🔊 Read to me</button>
    <small>This answer is written by a computer. Check it with a grown-up.</small>
  </section>
  <section id="featured" class="featured" hidden>
    <div id="flist"></div>
    <button id="more" class="more" type="button" hidden>More featured results...</button>
  </section>
  <div id="cse">
    <div class="gcse-searchresults-only" data-gname="khoj" data-safeSearch="active"
         data-enableImageSearch="true" data-linkTarget="_blank" data-personalizedAds="false"
         data-noResultsString="Nothing found. Try different words!"></div>
  </div>
</main>
<footer class="foot">
  <p>Khoj has no accounts and doesn't save what you search for.</p>
  <p>Our filters are strong, but not perfect. If you see something weird, tell a grown-up.</p>
</footer>
<dialog id="lb"></dialog>
<script src="khoj.js"></script>
<script async src="https://cse.google.com/cse.js?cx=a1b1831f0d16e4b3a"></script>
</body>
</html>
